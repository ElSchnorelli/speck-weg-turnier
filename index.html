<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Speck-weg-Turnier</title>

  <!-- Diese Meta-Tags sorgen dafür, dass die App auf dem iPad wie eine eigene
       App aussieht, wenn man sie über "Zum Home-Bildschirm hinzufügen" installiert. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Speck-weg" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <svg class="app-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="18" r="2.2" fill="currentColor" stroke="none" />
      <path d="M12 16 L7 6 M12 16 L10 4.5 M12 16 L14 4.5 M12 16 L17 6" />
      <path d="M6.5 6.2 L17.5 6.2" />
    </svg>
    <div class="app-header-text">
      <h1>Speck-weg-Turnier</h1>
      <p id="db-status" class="status-line">Datenbank wird geladen …</p>
    </div>
  </header>

  <nav class="app-nav">
    <button data-view="teilnehmer" class="nav-btn" aria-label="Teilnehmer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="9" cy="8" r="3" />
        <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6" />
        <circle cx="17" cy="9" r="2.3" />
        <path d="M15 20c0-2.5 1.8-4.5 4-4.8" />
      </svg>
      <span class="nav-label">Teilnehmer</span>
    </button>
    <button data-view="einstellungen" class="nav-btn" aria-label="Einstellungen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <line x1="4" y1="6" x2="20" y2="6" />
        <circle cx="9" cy="6" r="2" fill="currentColor" stroke="none" />
        <line x1="4" y1="12" x2="20" y2="12" />
        <circle cx="15" cy="12" r="2" fill="currentColor" stroke="none" />
        <line x1="4" y1="18" x2="20" y2="18" />
        <circle cx="7" cy="18" r="2" fill="currentColor" stroke="none" />
      </svg>
      <span class="nav-label">Einstellungen</span>
    </button>
    <button data-view="vorrunde" class="nav-btn" aria-label="Vorrunde">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="4" rx="1" />
        <rect x="3" y="10" width="18" height="4" rx="1" />
        <rect x="3" y="16" width="18" height="4" rx="1" />
      </svg>
      <span class="nav-label">Vorrunde</span>
    </button>
    <button data-view="ko" class="nav-btn" aria-label="KO-Runde">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M8 4h8v4a4 4 0 0 1-8 0V4z" />
        <path d="M8 5H5a3 3 0 0 0 3 4" />
        <path d="M16 5h3a3 3 0 0 1-3 4" />
        <line x1="12" y1="12" x2="12" y2="16" />
        <path d="M10 16h4l1 4H9l1-4z" />
      </svg>
      <span class="nav-label">KO-Runde</span>
    </button>
    <button data-view="ergebnis" class="nav-btn" aria-label="Ergebnis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="5" y1="3" x2="5" y2="21" />
        <path d="M5 4h13l-3 4 3 4H5" />
      </svg>
      <span class="nav-label">Ergebnis</span>
    </button>
  </nav>

  <main id="view-container">
    <p class="placeholder">Wähle oben einen Bereich aus.</p>
  </main>

  <script src="libs/xlsx.full.min.js"></script>
  <script src="libs/jspdf.umd.min.js"></script>
  <script src="libs/jspdf.plugin.autotable.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
